name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: line_oa_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d line_oa_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://billing:billing@localhost:5432/line_oa_billing_test
      APP_TIMEZONE: Asia/Bangkok
      ADMIN_API_KEY: change-me
      INTERNAL_JOB_API_KEY: change-me
      JWT_SECRET: ci-test-jwt-secret
      SUPER_ADMIN_PASSWORD: ci-test-password
      LOCAL_STORAGE_PATH: /tmp/line-oa-ci-storage
      OCR_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx prisma migrate deploy
      - run: bunx tsc --noEmit
      - run: bun test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:liff
      - run: bun run build
        env:
          VITE_API_BASE: ""
          VITE_LIFF_ID: ci-test-liff-id
      - uses: actions/upload-artifact@v4
        with:
          name: admin-preview
          path: admin/dist
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag bot-ban-lekha-backend:ci .
      - run: docker build --build-arg VITE_LIFF_ID=ci-test-liff-id --tag bot-ban-lekha-admin:ci ./admin
